<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Oswald;src:url(fonts/oswald-latin-700.ttf);font-weight:700}
@font-face{font-family:Oswald;src:url(fonts/oswald-latin-500.ttf);font-weight:500}
html,body{margin:0;padding:0;overflow:hidden;background:#121722}
#root{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}

<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="root"></div>
<script type="module">
import { Stage } from './stage.js';
window.setup = async (specUrl) => {
  const spec = await (await fetch(specUrl)).json();
  await document.fonts.load('700 40px Oswald'); await document.fonts.load('500 40px Oswald');
  const mod = await import(spec.module);
  const stage = new Stage(spec);
  const frame = await mod.build(stage, spec);
  window.frame = (i) => { const t = i / spec.fps; frame(t, i); stage.updateTexts(t); stage.render(); };
  return spec.n_frames;
};
window.READY = true;
</script></body></html>
