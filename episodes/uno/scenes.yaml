# The Best Way to Play Uno: scene list (scene kit templates, docs/scene-kit.md). `lines` = narration ids in script.md.
# Bar values are data refs into data/*.json. Typed numbers in callouts/statements are traced in script.md's header.
# Card names are written as words ("Draw Two"), so the numbers gate only sees real claims.
music:              # YouTube Audio Library, no attribution required (local only, not in git)
  - music/days-are-long-silent-partner.mp3
  - music/renunciation-asher-fulero.mp3
  - music/ponderous-days-joel-cummins.mp3
engine: 3d
grade: eq=saturation=1.12:contrast=1.04   # light colour grade baked into every scene
burn_captions: false  # creator: no burned-in captions; YouTube CC covers it, animations carry the screen
voice_style: studio   # no-AI studio chain: de-reverb, broadcast EQ, compression (pipeline/studio_voice.py)
look: clean-sage
quality: high
ssaa: 1.5
scenes:
- id: cold
  chapter: Everybody plays differently
  render: table
  lines:
  - o1
  - o2
  - o3
  pad:
  - 0.4
  - 0.5
  params:
    players: 4
    elev: 36
    yaw: 5
    push: 0.1
    names:
    - THE STACKER
    - THE RULES LAWYER
    - THE SWAPPER
    - THE KEEP-DRAWER
    hands: 7
    pile: uno:2:4
    turns:
    - at: o1@differently
      seat: 2
      ev: play
      card: uno:2:9
    - at: o2@plus
      seat: 3
      ev: play
      card: uno:2:12
      label: DRAW TWO
    - at: o2@stack
      seat: 0
      ev: play
      card: uno:0:12
      label: STACKED!
    - at: o2@stack+0.5
      seat: 1
      ev: draw
      label: TAKES FOUR
    - at: o2@stack+0.5+0.15
      seat: 1
      ev: draw
    - at: o2@stack+0.5+0.30
      seat: 1
      ev: draw
    - at: o2@stack+0.5+0.45
      seat: 1
      ev: draw
    - at: o2@swap
      seat: 2
      ev: play
      card: uno:0:7
      label: A SEVEN
    - at: o2@seven
      ev: swap
      seat: 2
      with: 0
      label: SWAP HANDS
    - at: o2@keep
      seat: 3
      ev: draw
      label: KEEP DRAWING
    - at: o2@drawing
      seat: 3
      ev: draw
    - at: o2@drawing#2
      seat: 3
      ev: draw
    - at: o2@until
      seat: 3
      ev: draw
    - at: o2@play#2
      seat: 3
      ev: play
      card: uno:0:3
    - at: o3@took
      seat: 0
      ev: play
      card: uno:0:5
    - at: o3@bots
      seat: 1
      ev: play
      card: uno:1:5
    - at: o3@billion
      seat: 2
      ev: play
      card: uno:1:8
    highlight:
    - - 0
      - o2@stack
    - - 2
      - o2@swap
    - - 3
      - o2@keep
    - - 1
      - o2@real
      - THAT'S NOT A REAL RULE!
    callouts:
    - text: Every house rule vs the official game
      at: o3@every
    - text: 23,000,000,000+ rounds
      at: o3@billion
- id: hook
  render: bars
  lines:
  - o4
  - o5
  params:
    title: The rules decide how much skill there is
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 42
      items:
      - label: Official rules
        value: =v2.json:combos[key=official].best*100
        at: o4@playing
        color: TEAL
        context: true
        pulse:
        - o5@rules
        - o5@skill
        - o5@official
      - label: The most skillful rules
        value: =v2.json:combos[key=stack+jump_in+draw_until+free_d4].best*100
        at: o5@third
        color: MUSTARD
        context: true
        hl: true
      - label: Pass your hand every turn
        value: =extras.json:rules.pass_every.best*100
        at: o5@lose
        color: CORAL
        context: true
    callouts:
    - text: How often a good player wins
      at: o4@wins
      color: CREAM
- id: title
  render: title
  min_duration: 2.5
  pad:
  - 0
  - 0
  params:
    lines:
    - The Best Way
    - text: to Play Uno
      color: MUSTARD
- id: deal
  chapter: The game in thirty seconds
  render: table
  lines:
  - g1
  - g2
  params:
    players: 4
    elev: 36
    yaw: 5
    push: 0.1
    names: &id001
    - YOU
    - PLAYER 2
    - PLAYER 3
    - PLAYER 4
    hands: 0
    turns:
    - at: g1@flipped
      ev: flip
      card: uno:0:5
      label: START THE PILE
    - at: g2@color
      seat: 0
      ev: play
      card: uno:0:9
      label: SAME COLOR
    - at: g2@number
      seat: 1
      ev: play
      card: uno:3:9
      label: SAME NUMBER
    - at: g2@wild
      seat: 2
      ev: play
      card: uno:4:13
      label: WILD
    highlight:
    - - 0
      - g2@turn
      - YOUR TURN
    - - 3
      - g2@zero
      - FIRST TO ZERO CARDS WINS
    deal:
      at: g1@seven
      count: 7
      every: 0.09
- id: cards
  render: deck
  lines:
  - g3
  pad:
  - 0.2
  - 1.0
  params:
    title: The action cards
    pill: 2 to 10 players
    piles:
    - card:
      - uno:0:3
      - uno:1:8
      - uno:2:1
      - uno:3:6
      count: 30
      label: Number cards
    - card: uno:3:10
      count: 8
      label: Skip
    - card: uno:2:11
      count: 8
      label: Reverse
    - card: uno:0:12
      count: 8
      label: Draw Two
    - card: uno:4:13
      count: 4
      label: Wild
    highlights:
    - - 1
      - g3@skip
    - - 2
      - g3@reverse
    - - 3
      - g3@draw
    - - 4
      - g3@wild
- id: wild4
