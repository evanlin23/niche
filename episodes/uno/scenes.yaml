- id: check
  chapter: Can you trust it?
  render: bars
  lines:
  - c3
  params:
    title: Opening hand has a Wild
    pill: 4 players · 112-card deck
    callouts:
    - text: Plain math vs my simulator
      at: c3@checked
    - text: Ten million deals
      at: c3@ten
    chart:
      unit: '%'
      decimals: 1
      maxV: 75
      items:
      - label: Plain math
        value: =engine_check.json:math_opening_hand_has_wild*100
        at: c3@fifty
        color: TEAL
      - label: My simulator
        value: =engine_check.json:opening_hand_has_wild*100
        at: c3@simulator
        color: MUSTARD
        hl: true
