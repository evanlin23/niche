    - uno:0:5
    - uno:0:9
    - uno:3:5
    - uno:1:2
    highlights:
    - card: 0
      at: g4@wild
      label: WILD DRAW FOUR
    - card: pile
      at: g4@current
      label: 'THE CURRENT COLOR: RED'
    - card: 1
      at: g4@nothing
      label: STILL HAVE RED? NO +4
    play:
    - card: 0
      at: g4@cheated
    callouts:
    - text: Most people have never heard this part
      at: g4@bet
      color: CREAM
    - text: 'Caught: you draw the 4'
      at: g4@caught
