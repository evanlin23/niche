# The Best Way to Play Uno: scene list (scene kit templates, docs/scene-kit.md). `lines` = narration ids in script.md.
# Bar values are data refs into data/*.json. Typed numbers in callouts/statements are traced in script.md's header.
# Card names are written as words ("Draw Two"), so the numbers gate only sees real claims.
music:              # YouTube Audio Library, no attribution required (local only, not in git)
  - music/days-are-long-silent-partner.mp3
  - music/renunciation-asher-fulero.mp3
  - music/ponderous-days-joel-cummins.mp3
engine: 3d
grade: eq=saturation=1.12:contrast=1.04   # light colour grade baked into every scene
burn_captions: false  # creator: no burned-in captions; YouTube CC covers it, animations carry the screen
voice_style: studio   # no-AI studio chain: de-reverb, broadcast EQ, compression (pipeline/studio_voice.py)
look: clean-sage
quality: high
ssaa: 1.5
scenes:
- id: cold
  chapter: Every family plays differently
  render: table
  lines: [o1, o2, o3]
  pad: [0.4, 0.5]
  params:
    players: 4
    names: [THE STACKER, THE SWAPPER, THE KEEP-DRAWER, THE RULES LAWYER]
    hands: 7
    highlight: [[0, o2@stack], [1, o2@swap], [2, o2@keep], [3, o2@say#2]]
    turns:
    - {at: o1@differently, seat: 3, ev: play, card: 'uno:3:4'}
    - {at: o2@stack, seat: 0, ev: play, card: 'uno:0:12', label: "STACKED!"}
    - {at: o2@swap, seat: 1, ev: play, card: 'uno:0:7', label: SWAP HANDS}
    - {at: o2@drawing, seat: 2, ev: draw, label: KEEP DRAWING}
    - {at: o2@until, seat: 2, ev: draw}
    - {at: o2@real, seat: 3, ev: play, card: 'uno:2:7', label: NOT A REAL RULE}
    turns_auto: {from: 0.3, every: 1.6}
    callouts:
    - {text: "Every house rule vs the official game", at: o3@every}
    - {text: "23,000,000,000+ rounds", at: o3@billion}
- id: hook1
  render: statement
  lines: [o4]
  params:
    lines:
    - 'The best way to play Uno:'
    - {text: "fast rounds", at: o4@rounds}
    - {text: "where skill wins", color: MUSTARD, at: o4@playing}
    callouts:
    - {text: "Rounds that don't drag on forever", at: o4@drag}
- id: hook2
  render: statement
  lines: [o5]
  params:
    lines:
    - 'The rules decide'
    - {text: "how much skill Uno has", color: MUSTARD, at: o5@skill}
    callouts:
    - {text: "A good player: more than a third of rounds", at: o5@third}
    - {text: "One rule set: playing well loses", at: o5@lose, color: CORAL}
    - {text: "Lots of 'official' rules aren't", at: o5@official, color: CREAM}
- id: title
  render: title
  min_duration: 2.5
  pad: [0, 0]
  params:
    lines: [The Best Way, {text: "to Play Uno", color: MUSTARD}]
- id: deal
  chapter: The game in thirty seconds
  render: table
  lines: [g1, g2]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: 7
    highlight: [[0, g2@turn]]
    turns:
    - {at: g1@while, seat: 1, ev: draw}
    - {at: g1@seven, seat: 0, ev: draw, label: SEVEN CARDS EACH}
    - {at: g1@flipped, seat: 3, ev: play, card: 'uno:0:5', label: START THE PILE}
    - {at: g2@color, seat: 0, ev: play, card: 'uno:0:9', label: SAME COLOR}
    - {at: g2@number, seat: 1, ev: play, card: 'uno:3:9', label: SAME NUMBER}
    - {at: g2@wild, seat: 2, ev: play, card: 'uno:4:13', label: WILD}
    - {at: g2@first, seat: 3, ev: play, card: 'uno:1:2', label: OUT OF CARDS}
    turns_auto: {from: 0.3, every: 1.8}
    callouts:
    - {text: "First to zero cards wins", at: g2@zero}
- id: cards
  render: deck
  lines: [g3]
  pad: [0.2, 1.0]
  params:
    title: "The action cards"
    pill: 2 to 10 players
    piles:
    - {card: ['uno:0:3', 'uno:1:8', 'uno:2:1', 'uno:3:6'], count: 30, label: Number cards}
    - {card: 'uno:3:10', count: 8, label: Skip}
    - {card: 'uno:2:11', count: 8, label: Reverse}
    - {card: 'uno:0:12', count: 8, label: Draw Two}
    - {card: 'uno:4:13', count: 4, label: Wild}
    highlights: [[1, g3@skip], [2, g3@reverse], [3, g3@draw], [4, g3@wild]]
- id: wild4
  render: fan
  lines: [g4]
  params:
    title: "The Wild Draw Four"
    seat_label: YOU
    pill: 4 players
    cards: ['uno:4:14', 'uno:0:5', 'uno:0:9', 'uno:3:5', 'uno:1:2']
    highlights:
    - {card: 0, at: g4@wild, label: WILD DRAW FOUR}
    - {card: 1, at: g4@nothing, label: "A RED CARD? THEN NO +4"}
    play:
    - {card: 0, at: g4@cheated}
    callouts:
    - {text: "Most people have never heard this part", at: g4@bet, color: CREAM}
    - {text: "Only with nothing in the current color", at: g4@only}
    - {text: "Think they cheated? Challenge", at: g4@challenge}
    - {text: "Caught: you draw the 4", at: g4@caught, color: CORAL}
- id: challenge
  render: bars
  lines: [g5]
  params:
    title: "The challenge rule: one habit changed"
    callouts:
    - {text: "Barely matters", at: g5@barely}
    - {text: "About half a point", at: g5@half, color: CREAM}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 36
      items:
      - {label: "Always challenges", value: "=results.json:habits.always challenge*100", at: g5@challenging}
      - {label: "Bluffs a Draw Four", value: "=results.json:habits.bluff Draw 4 half the time*100", at: g5@bluffing}
- id: sheet
  render: statement
  lines: [g6]
  params:
    lines:
    - 'The rule sheet:'
    - {text: "no stacking.", color: CORAL, at: g6@stack}
    - {text: "draw ONE card.", color: MUSTARD, at: g6@one}
- id: check
  chapter: Can you trust it?
  render: bars
  lines: [c3]
  params:
    title: Opening hand has a Wild
    pill: 4 players · 112-card deck
    callouts:
    - {text: "Plain math vs my simulator", at: c3@checked}
    - {text: "Ten million deals", at: c3@ten}
    chart:
      unit: '%'
      decimals: 1
      maxV: 75
      items:
      - {label: Plain math, value: "=engine_check.json:math_opening_hand_has_wild*100", at: c3@fifty, color: TEAL}
      - {label: My simulator, value: "=engine_check.json:opening_hand_has_wild*100", at: c3@simulator, color: MUSTARD, hl: true}
- id: bots
  render: fan
  lines: [c6]
  pad: [0.2, 1.0]
  params:
    title: A normal bot
    seat_label: NORMAL BOT
    pill: 4 players
    cards: ['uno:0:5', 'uno:0:9', 'uno:3:5', 'uno:4:13', 'uno:1:2', 'uno:0:12', 'uno:2:7']
    highlights:
    - {card: 0, at: c6@own, label: ITS OWN HAND}
    - {card: 4, at: c6@top, label: THE TOP CARD}
    - {card: 1, at: c6@matches, label: ANY MATCHING CARD}
    - {card: 3, at: c6@color, label: CALLS ITS BEST COLOR}
    play:
    - {card: 1, at: c6@plays}
    callouts:
    - {text: "Only what a real player knows", at: c6@real}
    - {text: "How many cards everyone holds", at: c6@holding}
- id: meetbest
  chapter: How much skill is in Uno?
  render: table
  lines: [m1, m2]
  params:
    players: 4
    names: [BEST BOT, NORMAL BOT, NORMAL BOT, NORMAL BOT]
    hands: 5
    highlight: [[0, m1@best], [0, m2@win]]
    turns:
    - {at: m1@best, seat: 0, ev: play, card: 'uno:4:13', label: EVERY GOOD HABIT}
    - {at: m1@three, seat: 1, ev: play, card: 'uno:2:5'}
    - {at: m1@normal, seat: 2, ev: play, card: 'uno:2:8'}
    turns_auto: {from: 0.4, every: 1.7}
    callouts:
    - {text: "How do you measure skill?", at: m1@measure}
    - {text: "Pure luck: 1 round in 4", at: m2@pure}
    - {text: "Exactly 25%", at: m2@twenty, color: MUSTARD}
- id: meter
  render: bars
  lines: [m3, m4]
  params:
    title: "The skill meter"
    callouts:
    - {text: "Four points of skill", at: m3@four}
    - {text: "Mostly the cards you're dealt", at: m3@dealt, color: CREAM}
    - {text: "Same size table", at: m4@size}
    - {text: "Close to the luck end", at: m4@luck, color: CORAL}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 54
      items:
      - {label: "Uno, official rules", value: "=v2.json:combos[key=official].best*100", at: m3@twenty, color: TEAL}
      - {label: "Exploding Kittens", value: "=../../exploding-kittens/data/final.json:vs_casual.4.win*100", at: m4@forty, color: MUSTARD, hl: true}
- id: stacking
  chapter: House rules on the meter
  render: table
  lines: [r1, r2]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: 5
    highlight: [[2, r2@nudges]]
    turns:
    - {at: r2@stacking, seat: 0, ev: play, card: 'uno:0:12', label: DRAW TWO}
    - {at: r2@everybody, seat: 1, ev: play, card: 'uno:3:12', label: "STACKED!"}
    - {at: r1@check, seat: 3, ev: play, card: 'uno:2:4'}
    - {at: r2@barely, seat: 0, ev: play, card: 'uno:1:6'}
    callouts:
    - {text: "One house rule at a time", at: r1@one}
    - {text: "The rule everybody looks up", at: r2@looked, color: CREAM}
    - {text: "Player 3 takes four", at: r2@nudges, color: CORAL}
    - {text: "Skill meter: 30%", at: r2@thirty, color: MUSTARD}
    - {text: "Barely anything", at: r2@barely}
- id: sevenzero
  render: table
  lines: [r3]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: [6, 3, 7, 5]
    highlight: [[0, r3@seven#2], [1, r3@zero#2], [3, r3@starts]]
    turns:
    - {at: r3@seven#2, seat: 0, ev: play, card: 'uno:3:7', label: "SEVEN: SWAP"}
    - {at: r3@zero#2, seat: 1, ev: play, card: 'uno:2:0', label: "ZERO: PASS ALL"}
    - {at: r3@take, seat: 2, ev: draw}
    - {at: r3@starts, seat: 3, ev: play, card: 'uno:1:4', label: GOES FIRST}
    callouts:
    - {text: "Skill meter: 26%", at: r3@twenty, color: CORAL}
    - {text: "My guess: hard to plan a hand that gets taken", at: r3@guess, color: CREAM}
    - {text: "Going first: almost 27% officially", at: r3@official}
    - {text: "With Seven Zero: dead even", at: r3@dead, color: CORAL}
- id: jumpin
  render: table
  lines: [r4]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: 5
    highlight: [[2, r4@slap]]
    turns:
    - {at: r4@holding, seat: 0, ev: play, card: 'uno:0:6', label: RED SIX}
    - {at: r4@slap, seat: 2, ev: play, card: 'uno:0:6', label: "JUMP IN!"}
    turns_auto: {from: 0.3, every: 1.5}
    callouts:
    - {text: "The exact same card, out of turn", at: r4@exact}
    - {text: "Skill meter: 30.5%", at: r4@thirty, color: MUSTARD}
- id: free4
  render: table
  lines: [r5]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: 5
    turns:
    - {at: r5@free, seat: 0, ev: play, card: 'uno:4:14', label: DRAW FOUR}
    - {at: r5@time, seat: 1, ev: draw, label: "+4"}
    - {at: r5@challenges, seat: 2, ev: play, card: 'uno:4:14', label: NO CHALLENGE}
    turns_auto: {from: 0.3, every: 1.6}
    callouts:
    - {text: "Any time, no challenges", at: r5@challenges}
    - {text: "Skill meter: 31%", at: r5@thirty, color: MUSTARD}
    - {text: "Highest single house rule", at: r5@highest, color: MUSTARD}
    - {text: "I never knew it wasn't real", at: r5@knowing, color: CREAM}
- id: drawuntil
  render: bars
  lines: [r6]
  params:
    title: Average turns per round
    callouts:
    - {text: "Barely moves the meter", at: r6@barely}
    - {text: "Everything takes forever", at: r6@forever, color: CORAL}
    - {text: "1 round in 10: over 170 turns", at: r6@ten, color: CORAL}
    chart:
      players: 4
      unit: ''
      decimals: 0
      items:
      - {label: Official, value: "=v2.json:combos[key=official].turns", at: r6@forty, color: TEAL}
      - {label: Draw until you can play, value: "=v2.json:combos[key=draw_until].turns", at: r6@eighty, color: CORAL, hl: true}
- id: noout
  render: table
  lines: [r7]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: [1, 5, 4, 6]
    turns:
    - {at: r7@allowed, seat: 0, ev: play, card: 'uno:3:10', label: "LAST CARD: SKIP?"}
    - {at: r7@wild, seat: 0, ev: draw, label: NOT ALLOWED}
    - {at: r7@drops, seat: 1, ev: play, card: 'uno:1:3'}
    turns_auto: {from: 0.5, every: 1.8}
    callouts:
    - {text: "Can't go out on an action card or Wild", at: r7@kills}
    - {text: "Skill meter: 25.5%", at: r7@twenty, color: CORAL}
    - {text: "Basically pure luck", at: r7@basically, color: CORAL}
    - {text: "Rounds get longer too", at: r7@longer}
- id: everything
  render: checklist
  lines: [r8]
  params:
    title: "Every house rule at once"
    items:
    - {text: Stacking, at: r8@stacking}
    - {text: Seven Zero, at: r8@seven}
    - {text: Jump In, at: r8@jump}
    - {text: Draw until you can play, at: r8@draw}
    - {text: Free Draw Four, at: r8@free}
    - {text: "86 turns a round", at: r8@eighty, color: CORAL}
    callouts:
    - {text: "Less skill than the official game: 28.5%", at: r8@twenty, color: CORAL}
    cards: ['uno:0:12', 'uno:3:12', 'uno:4:14', 'uno:0:2', 'uno:1:2', 'uno:3:2']
- id: bounce
  render: table
  lines: [r9]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: 5
    highlight: [[1, r9@reverse]]
    turns:
    - {at: r9@bounce, seat: 0, ev: play, card: 'uno:0:12', label: DRAW TWO}
    - {at: r9@reverse, seat: 1, ev: play, card: 'uno:0:11', label: "BOUNCE!"}
    - {at: r9@played, seat: 0, ev: draw, label: TAKES TWO}
    turns_auto: {from: 0.3, every: 1.6}
    callouts:
    - {text: "Skill meter: 29%", at: r9@twenty, color: CREAM}
    - {text: "Changes nothing. Really fun.", at: r9@nothing, color: MUSTARD}
- id: myrules
  chapter: How I play
  render: checklist
  lines: [i1]
  params:
    title: "How I've always played"
    items:
    - {text: "Draw Two on Draw Two", at: i1@twos}
    - {text: "Draw Four on Draw Four (no mixing)", at: i1@fours}
    - {text: "Draw Four any time", at: i1@whenever}
    - {text: "Dump all of the same number at once", at: i1@dump, color: MUSTARD}
    cards: ['uno:0:2', 'uno:1:2', 'uno:3:2', 'uno:4:14', 'uno:0:12', 'uno:2:12']
- id: mine
  render: bars
  lines: [i2, i3]
  params:
    title: "My rules on the skill meter"
    callouts:
    - {text: "Out of 192 rule combinations", at: i3@combinations}
    - {text: "Best bot: 31%", at: i2@bot, color: MUSTARD}
    - {text: "Rounds: 47 → about 40 turns", at: i2@drop}
    - {text: "Top sixth of 192 combinations", at: i3@sixth, color: MUSTARD}
    - {text: "One of the better versions all along", at: i3@apparently, color: CREAM}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: "Official", value: "=v2.json:combos[key=official].best*100", at: 0.0, color: TEAL}
      - {label: "My rules", value: "=v2.json:combos[key=stack+free_d4+multi].best*100", at: i2@thirty, color: MUSTARD, hl: true}
- id: dump
  render: fan
  lines: [i4]
  params:
    title: "Dumping matching numbers"
    seat_label: YOU
    pill: 4 players
    cards: ['uno:0:2', 'uno:1:2', 'uno:3:2', 'uno:2:8', 'uno:4:13']
    highlights:
    - {card: 0, at: i4@habit, label: THREE TWOS}
    - {card: 1, at: i4@matching, label: SAME NUMBER}
    play:
    - {card: 0, at: i4@dump}
    - {card: 1, at: i4@dump+0.3}
    - {card: 2, at: i4@dump+0.6}
    callouts:
    - {text: "One at a time: 14% instead of 25%", at: i4@fourteen, color: CORAL}
    - {text: "If you can dump them, dump them", at: i4@basically, color: MUSTARD}
- id: stacks
  render: statement
  lines: [i5]
  params:
    lines:
    - 'With my rules:'
    - {text: "8+ cards at once: 1 round in 9", at: i5@eight}
    - {text: "10+: under 1 in 100", color: CORAL, at: i5@ten}
    callouts:
    - {text: "How big do the stacks get?", at: i5@checked, color: CREAM}
    - {text: "Somebody picks up 8 or more", at: i5@pick}

- id: twoplayer
  chapter: Other tables
  render: bars
  lines: [t1, t2]
  params:
    title: "One on one"
    callouts:
    - {text: "The meter shifts", at: t1@shifts}
    - {text: "Every seven swaps with your only opponent", at: t2@every}
    chart:
      players: 2
      fair: 50
      decimals: 1
      maxV: 70
      items:
      - {label: "Best bot, official", value: "=results.json:two_player.official.smart_vs_normal*100", at: t1@fifty, color: MUSTARD}
      - {label: Whoever goes first, value: "=results.json:two_player.official.table.first_seat_win*100", at: t1@first, color: TEAL}
      - {label: "Best bot, Seven Zero", value: "=results.json:two_player.seven_zero.smart_vs_normal*100", at: t2@barely, color: CORAL}
- id: tenplayers
  render: statement
  lines: [p1]
  params:
    lines:
    - 'More players:'
    - {text: "+7 turns each", at: p1@seven}
    - {text: "10 players: about 91 turns", color: MUSTARD, at: p1@ninety}
- id: passevery
  chapter: The extremes
  render: table
  lines: [x1]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: 5
    turns:
    - {at: x1@pure, seat: 0, ev: play, card: 'uno:0:5'}
    - {at: x1@easy, seat: 1, ev: play, card: 'uno:0:8'}
    - {at: x1@single, seat: 2, ev: draw}
    - {at: x1@force, seat: 3, ev: play, card: 'uno:3:8', label: PASS YOUR HAND}
    turns_auto: {from: 0.9, every: 2.1}
    callouts:
    - {text: "Pure luck? Easy.", at: x1@easy, color: CREAM}
    - {text: "Everyone passes their hand. Every turn.", at: x1@force, color: CORAL}
- id: passbars
  render: bars
  lines: [x2]
  params:
    title: "Pass your hand every turn"
    callouts:
    - {text: "Below a fair share", at: x2@below, color: CORAL}
    - {text: "Good at Uno = worse at Uno", at: x2@worse}
    - {text: "My guess: your setup goes to the next player", at: x2@guess, color: CREAM}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: "Best bot, pass every turn", value: "=extras.json:rules.pass_every.best*100", at: x2@twenty, color: CORAL, hl: true}
- id: joke
  render: fan
  lines: [x3]
  params:
    title: "The official sheet's blank-card idea"
    seat_label: YOU
    pill: 4 players
    cards: ['uno:4:16', 'uno:0:5', 'uno:3:9', 'uno:1:2', 'uno:2:7']
    highlights:
    - {card: 0, at: x3@blank, label: BLANK WILD}
    - {card: 0, at: x3@joke, label: TELL A JOKE}
    play:
    - {card: 0, at: x3@laughs}
    callouts:
    - {text: "Printed on the official rule sheet", at: x3@printed, color: CREAM}
    - {text: "Someone laughs: discard down to 1 card", at: x3@laughs}
    - {text: "Nobody laughs: draw 4", at: x3@nobody, color: CORAL}
- id: jokebars
  render: bars
  lines: [x4]
  params:
    title: "The joke card"
    callouts:
    - {text: "A laugh = a coin flip", at: x4@flip, color: CREAM}
    - {text: "Mostly a coin toss", at: x4@toss, color: CORAL}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: "Official", value: "=v2.json:combos[key=official].best*100", at: 0.0, color: TEAL}
      - {label: "Joke cards", value: "=extras.json:rules.joke_cards.best*100", at: x4@twenty, color: CORAL, hl: true}
- id: luckiest
  render: checklist
  lines: [x7]
  params:
    title: "The most luck-driven Uno"
    items:
    - {text: Draw until you can play, at: x7@draw}
    - {text: Dump matching numbers, at: x7@dump}
    - {text: "No going out on an action card", at: x7@going}
    - {text: "Best bot: 23.5%", at: x7@twenty, verdict: BELOW FAIR, color: CORAL}
    callouts:
    - {text: "Nobody should play this", at: x7@nobody, color: CORAL}
    cards: ['uno:0:12', 'uno:3:12', 'uno:4:14', 'uno:0:2', 'uno:1:2', 'uno:3:2']
- id: skilliest
  render: checklist
  lines: [x5, x6]
  params:
    title: "The most skillful Uno"
    items:
