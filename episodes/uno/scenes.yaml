# The Best Way to Play Uno: scene list (scene kit templates, docs/scene-kit.md). `lines` = narration ids in script.md.
# Bar values are data refs into data/*.json. Typed numbers in callouts/statements are traced in script.md's header.
# Card names are written as words ("Draw Two"), so the numbers gate only sees real claims.
music:              # YouTube Audio Library, no attribution required (local only, not in git)
  - music/days-are-long-silent-partner.mp3
  - music/renunciation-asher-fulero.mp3
  - music/ponderous-days-joel-cummins.mp3
engine: 3d
grade: eq=saturation=1.12:contrast=1.04   # light colour grade baked into every scene
burn_captions: false  # creator: no burned-in captions; YouTube CC covers it, animations carry the screen
voice_style: studio   # no-AI studio chain: de-reverb, broadcast EQ, compression (pipeline/studio_voice.py)
look: clean-sage
quality: high
ssaa: 1.5
scenes:
- id: cold
  chapter: Every family plays differently
  render: table
  lines: [o1, o2, o3]
  pad: [0.4, 0.5]
  params:
    players: 4
    names: [THE STACKER, THE SWAPPER, THE KEEP-DRAWER, THE RULES LAWYER]
    hands: 7
    highlight: [[0, o2@stack], [1, o2@swap], [2, o2@keep], [3, o2@say#2]]
    turns:
    - {at: o1@differently, seat: 3, ev: play, card: 'uno:3:4'}
    - {at: o2@stack, seat: 0, ev: play, card: 'uno:0:12', label: STACKED!}
    - {at: o2@swap, seat: 1, ev: play, card: 'uno:0:7', label: SWAP HANDS}
    - {at: o2@drawing, seat: 2, ev: draw, label: KEEP DRAWING}
    - {at: o2@until, seat: 2, ev: draw}
    - {at: o2@real, seat: 3, ev: play, card: 'uno:2:7', label: NOT A REAL RULE}
    callouts:
    - {text: "Every house rule vs the official game", at: o3@every}
    - {text: "23,000,000,000+ rounds", at: o3@billion}
- id: hook
  render: statement
  lines: [o4, o5]
  params:
    lines:
    - 'The best way to play Uno:'
    - {text: "fast rounds", at: o4@rounds}
    - {text: "where skill wins", color: MUSTARD, at: o4@playing}
    callouts:
    - {text: "The rules decide how much skill there is", at: o5@rules}
    - {text: "A good player: more than a third of rounds", at: o5@third}
    - {text: "One rule set: playing well loses", at: o5@lose, color: CORAL}
    - {text: "Half the 'official' rules aren't", at: o5@official, color: CREAM}
- id: title
  render: title
  min_duration: 2.5
  pad: [0, 0]
  params:
    lines: [The Best Way, {text: "to Play Uno", color: MUSTARD}]

# ------------------------------------------------------------------ the game
- id: deal
  chapter: The game in thirty seconds
  render: table
  lines: [g1, g2]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: 7
    highlight: [[0, g2@turn]]
    turns:
    - {at: g1@while, seat: 1, ev: draw}
    - {at: g1@seven, seat: 0, ev: draw, label: SEVEN CARDS EACH}
    - {at: g1@flipped, seat: 3, ev: play, card: 'uno:0:5', label: START THE PILE}
    - {at: g2@color, seat: 0, ev: play, card: 'uno:0:9', label: SAME COLOR}
    - {at: g2@number, seat: 1, ev: play, card: 'uno:3:9', label: SAME NUMBER}
    - {at: g2@wild, seat: 2, ev: play, card: 'uno:4:13', label: WILD}
    - {at: g2@first, seat: 3, ev: play, card: 'uno:1:2', label: OUT OF CARDS}
    callouts:
    - {text: "First to zero cards wins", at: g2@zero}
- id: cards
  render: deck
  lines: [g3, g4, g5]
  params:
    title: "What's in the box"
    pill: 2 to 10 players
    piles:
    - {card: ['uno:0:3', 'uno:1:8', 'uno:2:1', 'uno:3:6'], count: 30, label: Number cards}
    - {card: 'uno:3:10', count: 8, label: Skip}
    - {card: 'uno:2:11', count: 8, label: Reverse}
    - {card: 'uno:0:12', count: 8, label: Draw Two}
    - {card: 'uno:4:13', count: 4, label: Wild}
    - {card: 'uno:4:14', count: 4, label: Wild Draw Four}
    highlights: [[1, g3@skip], [2, g3@reverse], [3, g3@draw], [4, g3@wild], [5, g4@wild]]
    callouts:
    - {text: "Most people have never heard this part", at: g4@bet, color: CREAM}
    - {text: "Only with nothing in the current color", at: g4@only}
    - {text: "Think they cheated? Challenge", at: g4@challenge}
    - {text: "Caught: you draw the 4", at: g4@caught, color: CORAL}
    - {text: "The challenge barely matters", at: g5@barely}
    - {text: "Challenge or bluff: about half a point", at: g5@half, color: CREAM}
- id: sheet
  render: statement
  lines: [g6]
  params:
    lines:
    - 'The rule sheet:'
    - {text: "no stacking.", color: CORAL, at: g6@stack}
    - {text: "draw ONE card.", color: MUSTARD, at: g6@one}
- id: check
  chapter: Can you trust it?
  render: bars
  lines: [c3]
  params:
    title: Opening hand has a Wild
    pill: 4 players · 112-card deck
    callouts:
    - {text: "Plain math vs my simulator", at: c3@checked}
    - {text: "Ten million deals", at: c3@ten}
    chart:
      unit: '%'
      decimals: 1
      maxV: 75
      items:
      - {label: Plain math, value: "=engine_check.json:math_opening_hand_has_wild*100", at: c3@fifty, color: TEAL}
      - {label: My simulator, value: "=engine_check.json:opening_hand_has_wild*100", at: c3@simulator, color: MUSTARD, hl: true}
- id: bots
  render: fan
  lines: [c6]
  params:
    title: A normal bot
    seat_label: NORMAL BOT
    pill: 4 players
    cards: ['uno:0:5', 'uno:0:9', 'uno:3:5', 'uno:4:13', 'uno:1:2', 'uno:0:12', 'uno:2:7']
    highlights:
    - {card: 0, at: c6@own, label: ITS OWN HAND}
    - {card: 4, at: c6@top, label: THE TOP CARD}
    - {card: 1, at: c6@matches, label: ANY MATCHING CARD}
    - {card: 3, at: c6@color, label: CALLS ITS BEST COLOR}
    play:
    - {card: 1, at: c6@plays}
    callouts:
    - {text: "Only what a real player knows", at: c6@real}
    - {text: "How many cards everyone holds", at: c6@holding}

# ------------------------------------------------------------------ the skill meter
- id: meter
  chapter: How much skill is in Uno?
  render: bars
  lines: [m1, m2, m3, m4]
  params:
    title: The skill meter
    callouts:
    - {text: "Best bot vs three normal players", at: m1@best}
    - {text: "Pure luck: exactly 25%", at: m2@pure}
    - {text: "Four points of skill", at: m3@four}
    - {text: "Mostly the cards you're dealt", at: m3@dealt, color: CREAM}
    - {text: "Close to the luck end", at: m4@luck, color: CORAL}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 54
      items:
      - {label: "Uno, official rules", value: "=v2.json:combos[key=official].best*100", at: m3@twenty, color: TEAL}
      - {label: "Exploding Kittens", value: "=../../exploding-kittens/data/final.json:vs_casual.4.win*100", at: m4@forty, color: MUSTARD, hl: true}
- id: meterhouse
  chapter: House rules on the meter
  render: bars
  lines: [r1, r2, r3, r4, r5]
  params:
    title: "Skill meter: one house rule at a time"
    callouts:
    - {text: "The rule everybody looks up", at: r2@looked, color: CREAM}
    - {text: "Barely anything", at: r2@barely}
    - {text: "A seven swaps, a zero passes every hand", at: r3@zero}
    - {text: "My guess: hard to plan a hand that gets taken", at: r3@guess, color: CREAM}
    - {text: "Going first: almost 27% officially", at: r3@starts}
    - {text: "With Seven Zero: dead even", at: r3@dead, color: CORAL}
    - {text: "Slap the same card down out of turn", at: r4@slap}
    - {text: "Any time, no challenges", at: r5@challenges}
    - {text: "Highest single house rule", at: r5@highest, color: MUSTARD}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: Official, value: "=v2.json:combos[key=official].best*100", at: r1@check, color: TEAL}
      - {label: Stacking, value: "=v2.json:combos[key=stack].best*100", at: r2@thirty}
      - {label: Seven Zero, value: "=v2.json:combos[key=seven_zero].best*100", at: r3@twenty, color: CORAL}
      - {label: Jump In, value: "=v2.json:combos[key=jump_in].best*100", at: r4@thirty}
      - {label: Free Draw Four, value: "=v2.json:combos[key=free_d4].best*100", at: r5@thirty, color: MUSTARD, hl: true}
- id: drawuntil
  render: bars
  lines: [r6]
  params:
    title: Average turns per round
    callouts:
    - {text: "Barely moves the meter", at: r6@barely}
    - {text: "Everything takes forever", at: r6@forever, color: CORAL}
    - {text: "1 round in 10: over 170 turns", at: r6@ten, color: CORAL}
    chart:
      players: 4
      unit: ''
      decimals: 0
      items:
      - {label: Official, value: "=v2.json:combos[key=official].turns", at: r6@forty, color: TEAL}
      - {label: Draw until you can play, value: "=v2.json:combos[key=draw_until].turns", at: r6@eighty, color: CORAL, hl: true}
- id: meterhouse2
  render: bars
  lines: [r7, r8, r9]
  params:
    title: "Skill meter: the rest"
    callouts:
    - {text: "No going out on an action card or Wild", at: r7@allowed}
    - {text: "Basically pure luck", at: r7@basically, color: CORAL}
    - {text: "Every house rule at once", at: r8@throw}
    - {text: "86 turns a round", at: r8@eighty, color: CORAL}
    - {text: "Reverse sends a Draw Two back", at: r9@reverse}
    - {text: "Changes nothing. Really fun.", at: r9@nothing, color: CREAM}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: "Can't go out on an action", value: "=v2.json:combos[key=no_action_out].best*100", at: r7@twenty, color: CORAL}
      - {label: "Everything at once", value: "=v2.json:combos[key=stack+stack_mix+seven_zero+jump_in+draw_until+free_d4].best*100", at: r8@twenty}
      - {label: Bounce, value: "=extras.json:rules.bounce.best*100", at: r9@twenty, color: TEAL}

# ------------------------------------------------------------------ how I play
- id: myrules
  chapter: How I play
  render: checklist
  lines: [i1]
  params:
    title: "How I've always played"
    items:
    - {text: "Draw Two on Draw Two", at: i1@twos}
    - {text: "Draw Four on Draw Four (no mixing)", at: i1@fours}
    - {text: "Draw Four any time", at: i1@whenever}
    - {text: "Dump all of the same number at once", at: i1@dump, color: MUSTARD}
    cards: ['uno:0:2', 'uno:1:2', 'uno:3:2', 'uno:4:14', 'uno:0:12', 'uno:2:12']
- id: mine
  render: bars
  lines: [i2, i3, i4]
  params:
    title: "My rules: best bot vs three normal players"
    callouts:
    - {text: "Rounds: 47 → about 40 turns", at: i2@drop}
    - {text: "Top sixth of 192 combinations", at: i3@sixth, color: MUSTARD}
    - {text: "One of the better versions all along", at: i3@apparently, color: CREAM}
    - {text: "Matching numbers one at a time", at: i4@hold, color: CORAL}
    - {text: "If you can dump them, dump them", at: i4@basically}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: "Best bot, my rules", value: "=v2.json:combos[key=stack+free_d4+multi].best*100", at: i2@thirty, color: MUSTARD, hl: true}
      - {label: "One card at a time", value: "=v2.json:habits_mine.one card at a time*100", at: i4@fourteen, color: CORAL}
- id: stacks
  render: statement
  lines: [i5]
  params:
    lines:
    - 'With my rules:'
    - {text: "8+ cards at once: 1 round in 9", at: i5@eight}
    - {text: "10+: under 1 in 100", color: CORAL, at: i5@ten}

# ------------------------------------------------------------------ other tables
- id: twoplayer
  chapter: Other tables
  render: bars
  lines: [t1, t2, p1]
  params:
    title: One on one
    callouts:
    - {text: "Every seven swaps with your only opponent", at: t2@every}
    - {text: "10 players: about 91 turns a round", at: p1@ninety, color: CREAM}
    - {text: "About 7 more turns per extra player", at: p1@seven}
    chart:
      players: 2
      fair: 50
      decimals: 1
      maxV: 70
      items:
      - {label: "Best bot, official", value: "=results.json:two_player.official.smart_vs_normal*100", at: t1@fifty, color: MUSTARD}
      - {label: Whoever goes first, value: "=results.json:two_player.official.table.first_seat_win*100", at: t1@first, color: TEAL}
      - {label: "Best bot, Seven Zero", value: "=results.json:two_player.seven_zero.smart_vs_normal*100", at: t2@barely, color: CORAL}

# ------------------------------------------------------------------ the extremes
- id: passevery
  chapter: The extremes
  render: bars
  lines: [x1, x2]
  params:
    title: "Pure luck: pass your hand every turn"
    callouts:
    - {text: "Everyone passes their hand. Every turn.", at: x1@force, color: CORAL}
    - {text: "Below a fair share", at: x2@below, color: CORAL}
    - {text: "Good at Uno = worse at Uno", at: x2@worse}
    - {text: "My guess: your setup goes to the next player", at: x2@guess, color: CREAM}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: "Best bot, official", value: "=v2.json:combos[key=official].best*100", at: x1@luck, color: TEAL}
      - {label: "Best bot, pass every turn", value: "=extras.json:rules.pass_every.best*100", at: x2@twenty, color: CORAL, hl: true}
- id: joke
  render: fan
  lines: [x3, x4]
  params:
    title: "The official sheet's blank-card idea"
    seat_label: YOU
    pill: 4 players
    cards: ['uno:4:16', 'uno:0:5', 'uno:3:9', 'uno:1:2', 'uno:2:7']
    highlights:
    - {card: 0, at: x3@blank, label: BLANK WILD}
    - {card: 0, at: x3@joke, label: TELL A JOKE}
    play:
    - {card: 0, at: x3@laughs}
    callouts:
    - {text: "Someone laughs: discard down to 1 card", at: x3@laughs}
    - {text: "Nobody laughs: draw 4", at: x3@nobody, color: CORAL}
    - {text: "A laugh = a coin flip", at: x4@simulated, color: CREAM}
    - {text: "Skill meter: 26.5%", at: x4@twenty}
    - {text: "Mostly a coin toss", at: x4@toss, color: CORAL}
- id: extremes
  render: bars
  lines: [x7, x5, x6]
  params:
    title: "The ends of the meter"
    callouts:
    - {text: "Draw until + dump numbers + no going out on action", at: x7@draw}
    - {text: "Nobody should play this", at: x7@nobody, color: CORAL}
    - {text: "Stacking + Jump In + free Draw Four + draw until", at: x5@stacking}
    - {text: "The catch: 84 turns a round", at: x6@eighty, color: CORAL}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 46
      items:
      - {label: "Most luck", value: "=v2.json:combos[key=draw_until+multi+no_action_out].best*100", at: x7@twenty, color: CORAL}
      - {label: "Most skill", value: "=v2.json:combos[key=stack+jump_in+draw_until+free_d4].best*100", at: x5@thirty, color: MUSTARD, hl: true}

# ------------------------------------------------------------------ the best way to play
- id: best
  chapter: The best way to play
  render: checklist
  lines: [b1, b2, b3]
  params:
    title: The best way to play Uno
    items:
    - {text: Stacking, at: b2@stacking}
    - {text: Jump In, at: b2@jump}
    - {text: Free Draw Four, at: b2@free}
    - {text: Dump matching numbers, at: b2@dumping}
    - {text: "About 39 turns a round", at: b2@thirty, verdict: FAST, color: MUSTARD}
    - {text: "Best bot wins 32%", at: b2@thirty#2, verdict: SKILL, color: MUSTARD}
    callouts:
    - {text: "Fast, and skill counts", at: b1@fast}
    - {text: "Almost twice the official skill", at: b2@twice, color: MUSTARD}
    - {text: "Want a coin toss? Add Seven Zero", at: b3@coin, color: CREAM}
    cards: ['uno:0:12', 'uno:3:12', 'uno:4:14', 'uno:0:2', 'uno:1:2', 'uno:3:2']

# ------------------------------------------------------------------ how to win
- id: habits
  chapter: How to win
  render: bars
  lines: [w1, w2, w3, w4, w5]
  params:
    title: "Under those rules: one habit changed"
    callouts:
    - {text: "One bot, one habit, three normal players", at: w1@every}
    - {text: "1. Dump every card of a number together", at: w2@dump}
    - {text: "2. Hold your Wilds", at: w3@hold}
    - {text: "3. Always stack", at: w4@always}
    - {text: "Switch to your best color: about +1.5", at: w5@switching, color: CREAM}
    - {text: "Jump in whenever you can: about +1", at: w5@jumping, color: CREAM}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 40
      items:
      - {label: "Holds numbers back", value: "=extras.json:habits_pick.one card at a time*100", at: w2@fifteen, color: CORAL}
      - {label: "Holds Wilds", value: "=extras.json:habits_pick.hold wilds*100", at: w3@twenty, color: MUSTARD, hl: true}
      - {label: "Never stacks", value: "=extras.json:habits_pick.never stack*100", at: w4@twenty, color: CORAL}
- id: oneMore
  render: statement
  lines: [w6]
  params:
    lines:
    - 'One more habit'
    - {text: "my bots never got wrong", color: MUSTARD, at: w6@bots}

# ------------------------------------------------------------------ saying uno
- id: sayuno
  chapter: Saying Uno
  render: bars
  lines: [u1, u2, u3, u4, u5]
  params:
    title: "Saying Uno: one bot vs three normal players"
    callouts:
    - {text: "So I made them forget", at: u1@made, color: CORAL}
    - {text: "Caught before the next turn: draw 2", at: u2@catches}
    - {text: "Everyone forgets 1 time in 4", at: u3@forgets}
    - {text: "Caught half the time", at: u3@half, color: CREAM}
    - {text: "Bigger than holding your Wilds", at: u3@bigger, color: MUSTARD}
    - {text: "Catching others: less than a point", at: u4@catching, color: CREAM}
    - {text: "Draw 4 instead of 2", at: u5@four}
    - {text: "Under my rules: 29%", at: u5@twenty}
    chart:
      players: 4
      fair: 25
      decimals: 1
      maxV: 46
      items:
      - {label: "Never forgets", value: "=v2.json:uno.official.never forgets*100", at: u3@thirty, color: MUSTARD, hl: true}
      - {label: "Always forgets", value: "=v2.json:uno.official.always forgets*100", at: u4@five, color: CORAL}
      - {label: "Never forgets (4-card penalty)", value: "=v2.json:uno.penalty4.never forgets*100", at: u5@thirty, color: MUSTARD}
- id: race
  render: table
  lines: [u6]
  params:
    players: 4
    names: [YOU, PLAYER 2, PLAYER 3, PLAYER 4]
    hands: [1, 5, 4, 6]
    highlight: [[0, u6@second], [2, u6@yells]]
    turns:
    - {at: u6@second, seat: 0, ev: play, card: 'uno:0:5', label: ONE CARD LEFT}
    - {at: u6@yells, seat: 2, ev: play, card: 'uno:2:5', label: "UNO!"}
    - {at: u6@draw, seat: 0, ev: draw, label: DRAW TWO}
    - {at: u6@three, seat: 0, ev: draw, label: BACK TO THREE}
    callouts:
    - {text: "It's a race", at: u6@race}
    - {text: "The race is a coin flip", at: u6@coin, color: CREAM}
    - {text: "Always wins the race: 41%", at: u6@forty, color: MUSTARD}
    - {text: "Always loses: basically never wins", at: u6@basically, color: CORAL}
    - {text: "3 rounds in 100,000", at: u6@hundred, color: CORAL}

# ------------------------------------------------------------------ close
- id: close
  render: statement
  lines: [e1]
  params:
    lines:
    - 'Official: mostly luck.'
    - {text: "My pick: almost twice the edge,", color: MUSTARD, at: e1@rules#2}
    - {text: "39 turns a round.", at: e1@thirty}
    callouts:
    - {text: "The best way to play Uno I found", at: e1@best}
- id: next
  render: statement
  lines: [n1, e2]
  pad: [0.3, 1.2]
  params:
    lines:
    - 'Next: Sorry!'
    - {text: "Where does your table land?", color: MUSTARD, at: e2@where}
    callouts:
    - {text: "Supposed to be pure luck", at: n1@supposed}
    - {text: "Best bot: a third of its games", at: n1@third}
    - {text: "What rule would you add?", at: e2@rule}
- id: endcard
  render: endcard
  min_duration: 12
  pad: [0, 0]
  params:
    next_title: "Sorry! Isn't Pure Luck"
