long:
  title: "The Best Way to Play Uno"
  description: |
    Uno is mostly luck under the official rules. Change the rules, and a good player can win almost twice as often as before.

    I built Uno from the official Mattel rule sheet (112 cards), gave the rules and every popular house rule to bots that only know what a real player knows, and tested every combination: 192 rule sets, stacking, Seven Zero, Jump In, draw until you can play, the free plus four, dumping matching numbers, and more. Then I tested the habits that win, including saying Uno.

    Everything in this video, the simulation, the animation and the charts, is made with code. Not affiliated with Mattel; card designs are my own.
  sources:
    - "Official rules: Mattel UNO instruction sheet GDJ85 (112 cards, 2-10 players)."
    - "Simulator: one test bot vs three normal bots, 20 to 270 million rounds per test, over 23 billion rounds in total, seats randomised."
  music_note: "Music (YouTube Audio Library): Days Are Long by Silent Partner, Renunciation by Asher Fulero, Ponderous Days by Joel Cummins."
  tags: [uno, uno rules, uno house rules, uno stacking, how to win uno, uno strategy, uno 7 0, uno jump in, card games,
         board game strategy, simulation, game theory, buh simulates]
  category: Gaming
  contains_synthetic_media: false

