# Native 9:16 Shorts (python -m pipeline.shorts_native uno). Kit templates, long-video timing, audio cut from the
# long video. Numbers come from data/*.json. Each opens on its spoken hook with the main visual already on screen.
# Titles are questions (no "N games simulated", no big number first).
game: "Uno"   # context pill above the hook
shorts:
- id: skill-or-luck
  hook: 'Is Uno skill

    or luck?'
  title: Is Uno actually a game of skill?
  description: 'My best bot vs three normal players, official rules. Full video with every house rule on my channel. #uno #cardgames #boardgames'
  scenes:
  - id: sl-meter
    render: bars
    lines:
    - m2
    - m3
    - m4
    params:
      callouts:
      - text: 'Pure luck: 1 in 4'
        at: m2@luck
      - text: Mostly the cards you're dealt
        at: m3@dealt
        color: CREAM
      chart:
        players: 4
        fair: 25
        decimals: 1
        maxV: 54
        items:
        - label: Uno, official rules
          value: =v2.json:combos[key=official].best*100
          at: m3@twenty
          color: TEAL
          pulse:
          - m4@luck
        - label: Exploding Kittens
          value: =../../exploding-kittens/data/final.json:vs_casual.4.win*100
          at: m4@forty
          color: MUSTARD
          hl: true
          pulse:
          - m4@size
- id: free-plus-four
  hook: 'Is the free +4

    a real rule?'
  title: Can you really play a +4 whenever you want in Uno?
  description: 'The free plus four is the biggest skill boost of any single house rule. Full video on my channel. #uno #cardgames #boardgames'
  scenes:
  - id: f4-hand
    render: fan
    lines:
    - r5
    params:
      seat_label: YOUR HAND
      pill: 4 players
      cards:
      - uno:4:14
      - uno:0:5
      - uno:0:9
      - uno:2:3
      - uno:4:14
      highlights:
      - card: 0
        at: r5@free
        label: DRAW FOUR
      - card: 1
        at: r5@time
        label: STILL HAVE RED? PLAY IT ANYWAY
      - card: 4
        at: r5@highest
        label: ANOTHER ONE
      play:
      - card: 0
        at: r5@challenges
      - card: 4
        at: r5@knowing
      callouts:
      - text: 'Skill meter: 31%'
        at: r5@thirty
        color: MUSTARD
- id: seven-zero
  hook: 'Does Seven Zero

    ruin Uno?'
  title: Does Seven Zero make Uno more luck?
  description: 'Swapping hands drags the skill meter down and wipes out the edge of going first. Full video on my channel. #uno #cardgames #boardgames'
  scenes:
  - id: sz-hand
    render: fan
    lines:
    - r3
    params:
      seat_label: YOUR HAND
      pill: 4 players
      cards:
      - uno:3:7
      - uno:0:4
      - uno:1:9
      - uno:2:2
      - uno:4:13
      - uno:0:0
      highlights:
      - card: 0
        at: r3@seven#2
        label: 'A SEVEN: SWAP WITH SOMEONE'
      - card: 5
        at: r3@zero#2
        label: 'A ZERO: EVERYONE PASSES'
      - card: 4
        at: r3@plan
        label: YOUR PLAN…
      - card: 1
        at: r3@take
        label: …NOW SOMEONE ELSE'S
      - card: 2
        at: r3@starts
        label: 'GOING FIRST: NO EDGE LEFT'
      play:
      - card: 0
        at: r3@swaps
      callouts:
      - text: 'Skill meter: 26%'
        at: r3@twenty
        color: CORAL
      - text: 'Going first: almost 27% officially'
        at: r3@official
- id: say-uno
  hook: 'What if you never

    forget to say Uno?'
  title: How much does forgetting to say Uno cost you?
  description: 'Everyone forgets one time in four. Full video on my channel. #uno #cardgames #boardgames'
  scenes:
  - id: su-bars
    render: bars
    lines:
    - u3
    - u4
    params:
      callouts:
      - text: Everyone forgets 1 time in 4
        at: u3@forgets
      - text: Caught half the time
        at: u3@half
        color: CREAM
      chart:
        players: 4
        fair: 25
        decimals: 1
        maxV: 46
        items:
        - label: Never forgets
          value: =v2.json:uno.official.never forgets*100
          at: u3@thirty
          color: MUSTARD
          hl: true
        - label: Always forgets
          value: =v2.json:uno.official.always forgets*100
          at: u4@five
          color: CORAL
          pulse:
          - u4@uno
