long:
  title: "I Simulated 100 Million Games of Exploding Kittens. Here's How to Win."
  description: |
    The best Exploding Kittens strategy is to do almost nothing. I built the game from the official
    rulebook, made bots that only know what a real player knows, and tested one habit at a time
    over 100+ million games. Six habits take you from a 25% win rate to 40% at a table of four.

    Everything in this video, the simulation, the animation and the music, is generated from code.
    Not affiliated with Exploding Kittens. Card designs are our own.
