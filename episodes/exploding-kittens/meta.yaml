long:
  title: "I Simulated 10 Billion Games of Exploding Kittens. Here's How to Win."
  description: |
    The best player at an Exploding Kittens table wins three times as often as the worst one, with the same cards. I simulated more than 10 billion games to find out why.

    I built the game from the official rulebook (original edition, 56 cards), made bots that only know what a real player would know, and tested one habit at a time, 100 million games per test. It comes down to five mistakes most tables make.

    Everything in this video, the simulation, the animation and the charts, is made with code. Not affiliated with Exploding Kittens; card designs are my own.
  sources:
    - "Exploding Kittens Original Edition rules (2025 printing): https://www.explodingkittens.com/pages/rules-kittens"
    - "Simulator: one test bot vs three 'normal' bots, 100,000,000 games per test (10.2 billion games total), seats randomised."
    - "Simulation code: https://github.com/evanlin23/niche/tree/HEAD/sims/ek"
  music_note: "Music (YouTube Audio Library): Days Are Long by Silent Partner, Renunciation by Asher Fulero, Ponderous Days by Joel Cummins."
  tags: [exploding kittens, exploding kittens strategy, how to win exploding kittens, exploding kittens tips, card game strategy,
         board game strategy, simulation, game theory, card games, party games, buh simulates]
  category: Gaming
  contains_synthetic_media: false

