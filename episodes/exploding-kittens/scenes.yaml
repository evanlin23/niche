# Exploding Kittens: scene list. `lines` = narration ids in script.md. Chart values come from data/*.json.
music:              # YouTube Audio Library, no attribution required (local only, not in git)
  - music/days-are-long-silent-partner.mp3
  - music/renunciation-asher-fulero.mp3
  - music/ponderous-days-joel-cummins.mp3
engine: 3d
grade: eq=saturation=1.12:contrast=1.04   # light colour grade baked into every scene
burn_captions: false  # creator: no burned-in captions; YouTube CC covers it, animations carry the screen
voice_style: studio   # no-AI studio chain: de-reverb, broadcast EQ, compression (pipeline/studio_voice.py)
look: clean-sage      # clean-sage | clean-ink | clean-light | (unset = warm game night)
quality: high         # high = reflections + glossy pieces + 4K shadows
ssaa: 1.5             # supersampling factor (smooth edges); override with RENDER_SSAA
scenes:
- id: cold
  chapter: Five mistakes
  render: table
  lines:
  - o1
  - o2
  - o3
  pad:
  - 0.4
  - 0.6
  params:
    callouts:
    - {text: "Same table, seats shuffled", at: o3@sat}
    - {text: "5 bots at one table", at: o3@bots}
    - {text: "10,200,000,000 games", at: o3@ten}
    mode: play
    ev_from: 10
    players: 5
    seat_names:
    - THE PATIENT ONE
    - THE NORMAL PLAYER
    - THE GAMBLER
    - THE PANICKER
    - THE HOARDER
    seat_hl:
    - [2, 'o2@plays']
    - [3, 'o2@skips']
    - [4, 'o2@steals']
    notes:
    - text: 10,000,000,000+ games
      at: o3@ten
      pos:
      - 960
      - 150
      align: center
      size: 60
      color: MUSTARD
- id: hookrank
  render: bars
  lines:
  - o4
  params:
    chart: ranking_hook
    title: Best bot vs worst bot
- id: five
  render: statement
  pad:
  - 0.2
  - 0.15
  lines:
  - o5
  params:
    lines:
    - It came down to
    - text: five mistakes.
      color: MUSTARD
- id: title
  render: title
  min_duration: 1.3
  pad:
  - 0
  - 0
  params:
    lines:
    - 10 Billion Games of
    - Exploding Kittens
- id: rules
  chapter: How the game works
  render: deck56
  lines:
  - g1
  - g4
  - g2
  - g3
  - c1
  pad:
  - 0.1
  - 0.4
  params:
    callouts:
    - {text: "\u2026unless you have a Defuse", at: g1@unless}
    - {text: "Every other card: avoid drawing", at: g1@every}
    - {text: "Everyone draws from one deck", at: g1@everyone}
    - {text: "Last player standing wins", at: g1@last}
    - {text: "Play as many cards as you like\u2026", at: g2@play}
    - {text: "\u2026then draw one card", at: g2@drawing}
    - {text: "That draw is where you explode", at: g2@explode}
    - {text: "Official rulebook \xB7 original edition", at: c1@official}
- id: check
  chapter: Can you trust it?
  render: statement
  lines:
  - c2
  - c3
  params:
    callouts:
    - {text: "First, a boring check", at: c2@boring}
    - {text: "3 Kittens in 23 cards", at: c2@three_in}
    lines:
    - 'First card is a Kitten:'
    - math says 13.04%
    - text: 'my deck: 13.07%'
      color: MUSTARD
- id: cantlie
  render: table
  lines:
  - c4
  - c5
  params:
    callouts:
    - {text: "Real players bluff", at: c5@bluff}
    - {text: "Bots just put it there", at: c5@mine}
    - {text: "Remember this one", at: c5@keep}
    mode: idle
    ev_still: 1
    labels: false
    knows:
      hand: c4@hand
      future: c4@see
      hid: c4@hid
    notes:
    - text: Bots only know what a real player knows
      at: c4
      pos:
      - 960
      - 150
      align: center
      size: 44
      until: c5
    - text: They can't lie.
      at: c5
      pos:
      - 960
      - 150
      align: center
      size: 64
      color: CORAL
- id: meet
  chapter: Meet the bots
  render: bots
  lines:
  - b1
  - b2
  - b3
  - b4
  params:
    title: "Who's at the table: five bots"
    bots:
    - name: The Normal Player
      color: CREAM
      at: b2@normal
      habits:
      - {text: Dodges only when it KNOWS a Kitten is next, at: b2@dodges}
      - {text: Hides Kittens at random, at: b2@hides}
      - {text: Sometimes plays a card just for fun, at: b2@now}
    - name: The Gambler
      color: CORAL
      at: b3@gambler
      habits:
      - {text: 'Plays cards on a whim, half the time', at: b3@whim}
    - name: The Panicker
      color: MUSTARD
      at: b3@panicker
      habits:
      - {text: Skips once 1 card in 4 could be a Kitten, at: b3@skips}
    - name: The Hoarder
      color: GREEN
      at: b3@hoarder
      habits:
      - {text: Never steals, at: b3@steals}
      - {text: Never peeks, at: b3@peeks}
    - name: The Patient One
      color: BLUE
      at: b4@patient
      habits:
      - {text: "???  (more on this one later)", at: b4@later}
- id: ranking
  render: bars
  lines:
  - b5
  params:
    chart: ranking
    title: 'One table, five bots, seats shuffled'
- id: testsetup
  render: statement
  lines:
  - b6
  params:
    callouts:
    - {text: "A ranking doesn't tell you why", at: b6@ranking}
    - {text: "100,000,000 games per change", at: b6@hundred}
    size: 0.85
    lines:
    - text: 3 Normal Players
      at: b6@three
    - text: + 1 test bot
      at: b6@plus
      color: MUSTARD
    - text: 'number to beat: 25%'
      at: b6@twenty
      color: MUSTARD
- id: m1
  render: statement
  lines:
  - p1
  params:
    lines:
    - 'Mistake 1:'
    - text: playing cards
      color: MUSTARD
    - text: for fun.
      color: MUSTARD
  chapter: 'Mistake 1: playing for fun'
- id: patience
  render: bars
  lines:
  - p2
  - p3
  - p4
  - p5
  params:
    callouts:
    - {text: "Remove the urge to play for fun", at: p2@remove}
    - {text: "Later is when it counts", at: p4@later_is}
    - {text: "\u2026while your chance of exploding is low", at: p5@low}
    - {text: "A Skip spent early is gone later", at: p4@spend}
    - {text: "First draw: about 1 in 7 is a Kitten", at: p4@seven}
    - {text: "Last few draws: mostly Kittens", at: p4@last}
    - {text: "Rulebook: \"save your cards early\"", at: p5@rulebook}
    - {text: "Almost nobody listens", at: p5@nobody}
    chart: patience
    title: 'Mistake 1: playing cards for fun'
    notes:
    - text: '"Save your cards early in the game, while your chance of exploding is low."  (the rulebook)'
      at: p5
      pos:
      - 960
      - 150
      align: center
      size: 30
      width: 1600
      weight: 700
- id: m2
  render: statement
  lines:
  - d1
  params:
    lines:
    - 'Mistake 2:'
    - text: panicking.
      color: CORAL
  chapter: 'Mistake 2: panicking'
- id: dodge
  render: bars
  lines:
  - d2
  - d3
  - d4
  params:
    callouts:
    - {text: "Most people start Skipping", at: d2@most}
    - {text: "The rule that held up:", at: d3@boring}
    - {text: "Panicker: Skips at 1 in 4", at: d2@deck}
    - {text: "A coin flip? Still worse", at: d3@coin}
    - {text: "Dodge only when you KNOW", at: d3@know}
    - {text: "Attack or Skip: barely matters", at: d4@barely}
    chart: dodge
    title: 'Mistake 2: panicking'
    notes:
    - text: 'Skip first vs Attack first: 16.1% vs 15.9%'
      at: d4
      pos:
      - 960
      - 150
      align: center
      size: 36
      pill: CREAM
- id: attacks
  render: bars
  lines:
  - d5
  - d6
  params:
    callouts:
    - {text: "Under Attack = 2 turns in a row", at: d5@stuck}
    - {text: "My guess: they still hold a Skip", at: d6@guess, color: CREAM}
    chart: attacks
    title: Explosions that happen under Attack
- id: m3
  render: statement
  lines:
  - f1
  params:
    lines:
    - 'Mistake 3:'
    - text: looking at
      color: MUSTARD
    - text: the wrong time.
      color: MUSTARD
  chapter: 'Mistake 3: looking at the wrong time'
- id: future
  render: bars
  lines:
  - f2
  - f3
  - f4
  params:
    callouts:
    - {text: "Kitten on top? Dodge", at: f3@dodge}
    - {text: "Not a Kitten? Draw, keep your Skip", at: f3@isn't}
    - {text: "Cards left \xF7 Kittens left", at: f4@count}
    - {text: "About 3? Time to peek", at: f4@about}
    - {text: "2 Kittens left = 6 cards or fewer", at: f4@six}
    chart: future
    title: 'Mistake 3: when to See the Future'
    notes:
    - text: 'Cards left ÷ Kittens left ≤ 3  →  peek'
      at: f4
      pos: [960, 150]
      align: center
      size: 40
      pill: MUSTARD
- id: m4
  render: statement
  lines:
  - k1
  params:
    lines:
    - 'Mistake 4:'
    - text: hiding the Kitten
      color: MUSTARD
    - text: in the wrong place.
      color: MUSTARD
  chapter: 'Mistake 4: the wrong hiding place'
- id: placement
  render: placement
  lines:
  - k2
  - k3
  - k4
  - k5
  - cta
  params:
    callouts:
    - {text: "The bottom of the deck\u2026", at: k3@bottom}
    - {text: "Best spot: the next player's draw", at: k4@best}
    - {text: "Defused? Put it back anywhere", at: k2@defuse}
    - {text: "The bottom feels safe\u2026", at: k3@safe}
    - {text: "My guess: it waits for whoever's left", at: k3@guess, color: CREAM}
    - {text: "Under Attack? Count your turns", at: k4@attack}
    plan:
    - [k2@random, 6]
    - [k3@bottom, 12]
    - [k4@top, 0]
    - [k4@second, 1]
    - [k4@third, 2]
    - [k5@thirty, 0]
    chart: placement
    title: 'Mistake 4: where to put the Kitten back'
- id: confession
  render: statement
  lines:
  - a1
  - a2
  params:
    callouts:
    - {text: "First draft: a neat explanation", at: a1@first}
    - {text: "The numbers come from the simulation", at: a2@simulation}
    - {text: "Quick confession", at: a1@confession}
    - {text: "Never tested the explanation \u2192 cut", at: a1@never, color: CORAL}
    - {text: "Guesses get labelled", at: a2@guess}
    lines:
    - The numbers are real.
    - text: Guesses get labelled.
      color: MUSTARD
  chapter: A quick confession
- id: m5
  render: statement
  lines:
  - s1
  params:
    lines:
    - 'Mistake 5:'
    - text: being too polite.
      color: MUSTARD
  chapter: 'Mistake 5: being polite'
- id: steal
  render: bars
  lines:
  - s2
  - s3
  - s4
  params:
    callouts:
    - {text: "They look like the weakest cards\u2026", at: s2@weakest}
    - {text: "Don't pair your Attacks or Skips", at: s4@don't, color: CORAL}
    - {text: "Every steal = a shot at their Defuse", at: s3@lottery}
    - {text: "Aim at the biggest hand", at: s3@biggest}
    - {text: "Any two matching cards = a pair", at: s4@any}
    - {text: "2 escapes for 1 random card", at: s4@trading, color: CORAL}
    chart: steal
    title: 'Mistake 5: steal from the biggest hand'
    notes:
    - text: 'Pairing Attacks or Skips to steal: 20%'
      at: s4
      pos:
      - 960
      - 150
      align: center
      size: 36
      pill: CORAL
- id: small
  render: bars
  lines:
  - x1
  - x2
  - x3
  - x4
  params:
    callouts:
    - {text: "Nope every Attack and steal aimed at you", at: x3@nope}
    - {text: "Kitten on top, can't dodge? Shuffle", at: x4@shuffle}
    - {text: "Worth less than a point", at: x4@less}
    chart: small
    title: The small stuff
    notes:
    - text: 'Shuffle when a Kitten is on top: under +1 point'
      at: x4
      pos:
      - 960
      - 150
      align: center
      size: 34
      pill: CREAM
  chapter: The small stuff
- id: seats
  render: bars
  lines:
  - t1
  - t2
  - t3
  params:
    chart: seats
    title: Does going first matter?
  chapter: Does going first matter?
- id: twoplayer
  render: bars
  lines:
  - t4
  - t5
  params:
    callouts:
    - {text: "Mistakes cost more with 2 players", at: t5@mistakes}
    chart: twoplayer
    title: 'Two players: every habit gets louder'
- id: tables
  render: bars
  lines:
  - r1
  - r2
  - r3
  params:
    callouts:
    - {text: "It doesn't break the game", at: r3@break}
    - {text: "It works because others make mistakes", at: r3@only}
    chart: tables
    title: The Patient One vs different tables
    notes:
    - text: 'Four Patient Ones: exactly 25% each'
      at: r3
      pos:
      - 960
      - 150
      align: center
      size: 36
      pill: CREAM
  chapter: Does it hold up?
- id: length
  render: bars
  lines:
  - r4
  params:
    chart: length
    title: Turns per game, four players
- id: strategy
  chapter: The recipe
  render: checklist
  lines:
  - w1
  - w2
  params:
    title: The Patient One
    step: 120
    size: 44
    items:
    - text: Don't play cards for fun
      at: w2@don't
    - text: Only dodge when you know
      at: w2@only
    - text: See the Future at 1 in 3 odds
      at: w2@peek
    - text: Kitten goes where the next player draws
      at: w2@put
    - text: Steal from the biggest hand
      at: w2@steal
    - text: Give away junk, Nope attacks on you
      at: w2@give
- id: final
  render: bars
  lines:
  - w3
  - w4
  params:
    chart: final
    title: The Patient One vs a normal table
- id: lie
  render: statement
  lines:
  - e1
  - e2
  params:
    callouts:
    - {text: "No bluffing", at: e2@pretend}
    - {text: "No nerves", at: e2@nervous}
    - {text: "That part is all yours", at: e2@yours}
    lines:
    - They can't lie.
    - text: That part is yours.
      color: MUSTARD
  chapter: The one thing bots can't do
- id: ask
  render: statement
  lines:
  - e3
  params:
    callouts:
    - {text: "Next: Uno house rules", at: e3@uno}
    - {text: "Which one breaks the game? \u2193", at: e3@tell}
    lines:
    - Which Uno house rule
    - text: breaks the game?
      color: CORAL
  pad:
  - 0.3
  - 1.2
- id: endcard
  render: endcard
  min_duration: 12
  pad:
  - 0
  - 0
  params:
    next_title: I Tested Every Uno House Rule
