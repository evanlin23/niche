    - text: + 1 test bot
      at: b6@plus
      color: MUSTARD
    - text: 'number to beat: 25%'
      at: b6@twenty
      color: MUSTARD
- id: m1
  render: statement
  lines:
  - p1
  params:
    lines:
    - 'Mistake 1:'
    - text: playing cards
      color: MUSTARD
    - text: for fun.
