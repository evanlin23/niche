# Shorts cut from the long video (python -m pipeline.shorts_cut episodes/exploding-kittens).
# Each one links back to the long video (YouTube: Shorts -> "Related video").
context: "Exploding Kittens"
shorts:
  - id: kitten-placement
    from: k2
    to: k5
    hook: "Where do you put\nthe Kitten back?"
    title: "Where should you put the Exploding Kitten back?"
    description: "Bottom of the deck is worse than random. Full video with all five mistakes on my channel. #explodingkittens #boardgames #cardgames"
  - id: same-cards
    from: o1
    to: o5
    hook: "Same cards.\n35% vs 11%"
    title: "Same cards, three times the wins. What is the best Exploding Kittens player doing?"
    description: "Five mistakes most tables make. Full video on my channel. #explodingkittens #boardgames #cardgames"
  - id: steal
    crop: [250, 1420]
    from: s2
    to: s4
    hook: "The 'weakest' cards\nwin you games"
    title: "The weakest cards in Exploding Kittens are secretly the best"
    description: "Steal from the biggest hand, and never pair up your Attacks. Full video on my channel. #explodingkittens #boardgames #cardgames"
  - id: going-first
    crop: [190, 1540]
    from: t1
    to: t3
    hook: "Does going first\nmatter?"
    title: "Does going first matter in Exploding Kittens?"
    description: "With two players it does. With five, it flips. Full video on my channel. #explodingkittens #boardgames #cardgames"
