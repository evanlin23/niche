name: Setup render toolchain
description: Python, Go (simulators), Node + three.js, ffmpeg, optional headless Chromium
inputs:
  browser:
    description: Install Playwright + Chromium
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12", cache: pip }
    - uses: actions/setup-go@v5
      with: { go-version: "1.24", cache: false }
    - uses: actions/setup-node@v4
      with: { node-version: "22" }
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg libegl1 libgl1 fonts-inter >/dev/null || sudo apt-get install -y -qq ffmpeg libegl1 libgl1 >/dev/null
        pip install -q numpy pillow skia-python pyyaml kokoro-onnx soundfile
        npm install --no-save --silent three@0.170.0
        (cd sims/ek && go build -o eksim .)
    - if: inputs.browser == 'true'
      shell: bash
      run: |
        npm install --no-save --silent playwright@1.48.2
        npx playwright install --with-deps chromium >/dev/null
